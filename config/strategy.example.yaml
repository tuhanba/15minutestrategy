# XAUUSD M15 PD Array + Rejection Block + OTE — örnek yapılandırma
# Tüm değerler doğrulanmamış başlangıç değerleridir. Bkz. docs/01_STRATEJI_SPESIFIKASYONU.md

mode: backtest            # backtest | demo | live  (live için ek şartlar: spec §13)

symbol:
  name: XAUUSD            # broker'a göre değişir (Q4)
  # digits/point/tick_size/tick_value/contract_size/volume_* MT5'ten çalışma anında okunur
  commission_rt_per_lot: 7.0      # VARSAYIM — broker'dan doğrula
  sl_slippage_ticks: 5
  max_spread_price: 0.50

timeframes:
  entry: M15
  htf: H1

swings:
  fractal_n: 2
  fractal_n_htf: 2

pd_arrays:
  enabled: [FVG, OB]              # BREAKER: faz 2
  fvg_min_atr: 0.10
  displacement_body_atr: 0.8
  ob_zone_mode: FULL              # FULL | BODY
  ob_bos_window: 3
  invalidation_mode: CLOSE        # CLOSE | WICK
  zone_max_age_bars: 192
  arm_timeout_bars: 8
  max_arms: 2

rejection_block:
  variant: R1                     # R1 (tek mum) | R2 (çok mum)
  min_wick_ratio: 0.50
  min_wick_atr: 0.25
  lookback: 5
  confirm_bars: 3
  equal_tol_atr: 0.10             # R2
  cluster_max_gap: 2              # R2
  min_range_atr: 0.10

ote:
  anchor_mode: RB_RANGE           # RB_RANGE | SWING_LEG
  level: 0.79
  swing_leg_end: CONFIRMED_SWING  # CONFIRMED_SWING | CONFIRM_HIGH
  swing_leg_timeout_bars: 8

stop:
  mode: STRUCTURAL                # STRUCTURAL | FIXED
  fixed_stop_price: null          # FİYAT birimi (ör. 1.00). "10 point" belirsiz — Q2
  sl_buffer_price: 0.30
  sl_buffer_spread_mult: 1.0
  min_stop_spread_mult: 3.0

target:
  tp_r_multiple: 5                # 5 | 6
  tp_cost_adjust: false

orders:
  expiry_bars: 8
  cancel_at_r_before_fill: TP     # TP | number (R)
  cancel_on_spread: true
  magic: 7915790

risk:
  risk_pct: 0.0025
  equity_ref: MIN_BALANCE_EQUITY
  max_lots: 5.0
  daily_loss_limit_pct: 0.010
  daily_loss_ref: MAX_BALANCE_EQUITY_AT_DAY_START
  day_reset: "00:00"
  day_reset_tz: SERVER
  max_total_dd_pct: 0.040
  total_dd_mode: STATIC
  max_trades_per_day: 3
  max_concurrent_risk_pct: 0.005
  max_consecutive_losses_halt: 4
  flatten_on_daily_breach: false

htf_filter:
  mode: OFF                       # OFF | H1_BOS | H1_BOS_PD | H1_ZONE

sessions:
  enabled: false                  # Q10 — kaynakta yok, ayrı varyant olarak test edilir
  blocked_windows_server: ["23:00-01:00"]   # rollover / geniş spread
  friday_cutoff_server: "20:00"

news:
  enabled: true
  calendar_csv: data/news_calendar.csv
  window_before_min: 15
  window_after_min: 15
  impact: [HIGH]
  currencies: [USD]

prop_firm_file: config/prop_firm.yaml

logging:
  journal_dir: logs/
  state_db: state/state.sqlite
